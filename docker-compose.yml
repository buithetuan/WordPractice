services:
  postgres:
    image: postgres:17
    container_name: vocab-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: vocab_learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 192.168.5.118

    ports:
      - "5432:5432"

    volumes:
      - ./home/tuanbt/db/postgres/data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d vocab_learning"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: